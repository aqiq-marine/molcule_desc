[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molcule-desc"
version = "0.1.0"
description = "Experimental compositional molecular structure prototype"
requires-python = ">=3.10"

[project.optional-dependencies]
chemistry = ["rdkit"]

[tool.setuptools]
packages = ["molcule_desc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
